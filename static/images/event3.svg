<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#0c1630" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <circle cx="350" cy="200" r="450" fill="url(#glow1)" />
  <circle cx="950" cy="450" r="400" fill="url(#glow2)" />

  <!-- Abstract Tech Grid Lines & Nodes -->
  <g stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.5" fill="none">
    <path d="M 150 120 L 300 200 L 450 160 L 600 280 L 800 200 L 1050 320" />
    <path d="M 100 480 L 280 400 L 520 480 L 780 390 L 980 520" />
    <path d="M 300 200 L 280 400" />
    <path d="M 600 280 L 520 480" />
    <path d="M 800 200 L 780 390" />
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="300" cy="200" r="5" />
    <circle cx="450" cy="160" r="4" />
    <circle cx="600" cy="280" r="6" />
    <circle cx="800" cy="200" r="5" />
    <circle cx="280" cy="400" r="5" />
    <circle cx="520" cy="480" r="6" />
    <circle cx="780" cy="390" r="5" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 90)">
    <rect width="280" height="38" rx="19" fill="rgba(255, 153, 0, 0.12)" stroke="#ff9900" stroke-width="1.5" />
    <circle cx="24" cy="19" r="6" fill="#ff9900" />
    <text x="42" y="24" fill="#ff9900" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">AWS FIRST CLOUD JOURNEY</text>
  </g>

  <g transform="translate(400, 90)">
    <rect width="200" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="19" r="6" fill="#38bdf8" />
    <text x="42" y="24" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">BITEXCO TOWER</text>
  </g>

  <!-- Main Event Title & Branding -->
  <text x="100" y="220" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    AWS GENAI BUILDATHON
  </text>
  <text x="100" y="280" fill="url(#primaryGrad)" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    &amp; CLOUD IMMERSION DAY
  </text>

  <!-- Subtitle Description -->
  <text x="100" y="340" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="20" font-weight="400">
    Hands-on Generative AI, Serverless Architecture &amp; Security Engineering
  </text>

  <!-- Feature Cards Container -->
  <g transform="translate(100, 400)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="150" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="40" cy="40" r="18" fill="rgba(255, 153, 0, 0.2)" />
    <path d="M 32 40 L 48 40 M 40 32 L 40 48" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round"/>
    <text x="24" y="85" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">Amazon Bedrock</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Foundation Models &amp; RAG</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="150" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="290" cy="40" r="18" fill="rgba(56, 189, 248, 0.2)" />
    <polygon points="286,32 296,40 286,48" fill="#38bdf8"/>
    <text x="274" y="85" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">AWS Lambda</text>
    <text x="274" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Serverless Microservices</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="150" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="540" cy="40" r="18" fill="rgba(168, 85, 247, 0.2)" />
    <rect x="533" y="33" width="14" height="14" rx="2" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <text x="524" y="85" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">Cloud Security</text>
    <text x="524" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">IAM &amp; Secrets Manager</text>

    <!-- Card 4 -->
    <rect x="750" y="0" width="250" height="150" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="790" cy="40" r="18" fill="rgba(34, 197, 94, 0.2)" />
    <polyline points="783,40 788,45 798,34" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="774" y="85" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="17" font-weight="700">Well-Architected</text>
    <text x="774" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">AWS 6 Pillars Framework</text>
  </g>

  <!-- AWS Logo Graphic in Corner -->
  <g transform="translate(1000, 70)" opacity="0.9">
    <path d="M 20 60 C 50 80, 110 80, 140 60" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
    <path d="M 135 55 L 145 62 L 138 68" fill="#ff9900" />
    <text x="35" y="45" fill="#ffffff" font-family="'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="1">aws</text>
  </g>
</svg>
